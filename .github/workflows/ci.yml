name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - name: Demo smoke test (generate → verify → minimize)
        shell: bash
        run: |
          node dist/cli.js generate fixtures/checkout-bug.json -o tests/repro/checkout.spec.ts --base-url http://localhost:4173
          node dist/cli.js verify tests/repro/checkout.spec.ts --expect reproduced
          node dist/cli.js minimize fixtures/checkout-bug.json --base-url http://localhost:4173
